     <!-- Main Content -->
<main class="main-content">
    <!-- Top Bar -->

           <!-- Selection Card with Search -->
    <div class="card">
        <h3>Generate Invoice</h3>
        <p style="color: var(--text-light); margin-bottom: 20px;">
            Search and select a booking to generate an invoice
        </p>
        
        <!-- Search Box -->
        <div style="margin-bottom: 20px;">
            <input 
                type="text" 
                id="searchInput" 
                placeholder="🔍 Search by guest name, booking reference, or room number..."
                style="width: 100%; padding: 15px; font-size: 16px; border: 2px solid var(--border-color); border-radius: 8px;"
            >
            <p id="searchCount" style="margin-top: 10px; color: var(--text-light); font-size: 14px;">
                <!-- Search count will appear here -->
            </p>
        </div>
        
        <!-- Booking Dropdown -->
        <select id="bookingSelect" style="width: 100%; padding: 15px; font-size: 16px; border: 2px solid var(--border-color); border-radius: 8px;">
            <option value="">Loading bookings...</option>
        </select>
    </div>

    <!-- Invoice Card -->
    <div id="invoiceCard" class="card" style="display: none;">
        <div style="margin-bottom: 20px;">
            <button onclick="window.print()" class="btn btn-primary">🖨️ Print Invoice</button>
            <button onclick="emailInvoice()" class="btn btn-secondary">📧 Email to Guest</button>
        </div>
        
        <div id="invoiceContent" class="invoice">
            <!-- Invoice will be generated here -->
        </div>
    </div>

    <!-- Load Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    
    <!-- Invoice Script -->
    <script>
    console.log('🧾 Invoice system starting...');
    
    // Initialize Supabase
    const SUPABASE_URL = 'https://yglehirjsxaxvrpfbvse.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlnbGVoaXJqc3hheHZycGZidnNlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjIwODA1NDAsImV4cCI6MjA3NzY1NjU0MH0.o631vL64ZMuQNDZQBs9Lx4ANILQgkq_5DrPhz36fpu8';
    
    let supabase;
    let currentInvoice = null;
    let allBookings = []; // Store all bookings for searching
    
    document.addEventListener('DOMContentLoaded', async function() {
        console.log('✅ Page loaded');
        
        if (window.supabase) {
            supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
            console.log('✅ Supabase initialized');
            await loadBookings();
            setupSearch();
        } else {
            console.error('❌ Supabase library not loaded');
            alert('Error: Database connection failed. Please refresh the page.');
        }
    });
    
    async function loadBookings() {
        console.log('📡 Loading bookings...');
        
        const dropdown = document.getElementById('bookingSelect');
        
        try {
            const { data: bookings, error } = await supabase
                .from('bookings')
                .select('*')
                .order('check_in', { ascending: false });
            
            if (error) throw error;
            
            allBookings = bookings; // Store for search
            console.log(`✅ Found ${bookings.length} bookings`);
            
            displayBookings(bookings);
            
            // Listen for selection
            dropdown.addEventListener('change', function() {
                if (this.value) {
                    generateInvoice(this.value);
                } else {
                    document.getElementById('invoiceCard').style.display = 'none';
                }
            });
            
        } catch (error) {
            console.error('❌ Error:', error);
            dropdown.innerHTML = '<option value="">Error loading bookings</option>';
            alert('Failed to load bookings: ' + error.message);
        }
    }
    
    function displayBookings(bookings) {
        const dropdown = document.getElementById('bookingSelect');
        const searchCount = document.getElementById('searchCount');
        
        dropdown.innerHTML = '<option value="">Select a booking...</option>';
        
        bookings.forEach(booking => {
            const option = document.createElement('option');
            option.value = booking.id;
            option.textContent = `${booking.booking_reference} - ${booking.guest_name} - Room ${booking.room_number || booking.room_type}`;
            dropdown.appendChild(option);
        });
        
        // Update count
        if (bookings.length === allBookings.length) {
            searchCount.textContent = `Showing all ${bookings.length} bookings`;
        } else {
            searchCount.textContent = `Found ${bookings.length} of ${allBookings.length} bookings`;
        }
        
        searchCount.style.color = bookings.length > 0 ? 'var(--text-light)' : 'var(--accent-gold)';
    }
    
    function setupSearch() {
        const searchInput = document.getElementById('searchInput');
        
        searchInput.addEventListener('input', function() {
            const searchTerm = this.value.toLowerCase().trim();
            
            if (!searchTerm) {
                // Show all bookings if search is empty
                displayBookings(allBookings);
                return;
            }
            
            // Filter bookings
            const filtered = allBookings.filter(booking => {
                const guestName = booking.guest_name.toLowerCase();
                const reference = booking.booking_reference.toLowerCase();
                const roomNumber = (booking.room_number || '').toLowerCase();
                const roomType = booking.room_type.toLowerCase();
                
                return guestName.includes(searchTerm) ||
                       reference.includes(searchTerm) ||
                       roomNumber.includes(searchTerm) ||
                       roomType.includes(searchTerm);
            });
            
            console.log(`🔍 Search: "${searchTerm}" - Found ${filtered.length} results`);
            displayBookings(filtered);
        });
        
        // Clear search on Escape key
        searchInput.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                this.value = '';
                displayBookings(allBookings);
            }
        });
    }
    
    async function generateInvoice(bookingId) {
        console.log('📄 Generating invoice for:', bookingId);
        
        try {
            const { data: booking, error: bookingError } = await supabase
                .from('bookings')
                .select('*')
                .eq('id', bookingId)
                .single();
            
            if (bookingError) throw bookingError;
            
            console.log('✅ Got booking:', booking.booking_reference);
            
            const { data: charges, error: chargesError } = await supabase
                .from('guest_charges')
                .select('*')
                .eq('booking_id', bookingId)
                .order('charge_date', { ascending: true });
            
            console.log(`💰 Found ${charges ? charges.length : 0} F&B charges`);
            
            const checkIn = new Date(booking.check_in);
            const checkOut = new Date(booking.check_out);
            const nights = Math.ceil((checkOut - checkIn) / (1000 * 60 * 60 * 24));
            
            const roomTotal = parseFloat(booking.total_price || 0);
            const fbTotal = charges ? charges.reduce((sum, c) => sum + parseFloat(c.total_amount), 0) : 0;
            const grandTotal = roomTotal + fbTotal;
            
            currentInvoice = { booking, charges, grandTotal };
            
            let html = `
                <div class="invoice-header">
                    <h2>TIMA SARA HOTEL</h2>
                    <p style="color: #666;">Tamale, Northern Region, Ghana</p>
                    <h3>GUEST INVOICE</h3>
                    <p>Date: ${new Date().toLocaleDateString('en-GB')}</p>
                </div>
                
                <div class="details-grid">
                    <div class="detail-section">
                        <h4>Guest Details</h4>
                        <p><strong>Name:</strong> ${booking.guest_name}</p>
                        <p><strong>Email:</strong> ${booking.guest_email}</p>
                        <p><strong>Phone:</strong> ${booking.guest_phone}</p>
                    </div>
                    <div class="detail-section">
                        <h4>Booking Details</h4>
                        <p><strong>Reference:</strong> ${booking.booking_reference}</p>
                        <p><strong>Room:</strong> ${booking.room_number || '—'}</p>
                        <p><strong>Check-in:</strong> ${checkIn.toLocaleDateString('en-GB')}</p>
                        <p><strong>Check-out:</strong> ${checkOut.toLocaleDateString('en-GB')}</p>
                    </div>
                </div>
                
                <h3 class="section-title">ROOM CHARGES</h3>
                <table>
                    <tr>
                        <td>${booking.room_type}</td>
                        <td style="text-align: center;">${nights} night(s)</td>
                        <td style="text-align: right; font-weight: bold;">₵${roomTotal.toFixed(2)}</td>
                    </tr>
                </table>
            `;
            
            if (charges && charges.length > 0) {
                html += `
                    <h3 class="section-title">FOOD & BEVERAGE CHARGES</h3>
                    <table>
                        <thead>
                            <tr>
                                <th>Item</th>
                                <th style="text-align: center;">Quantity</th>
                                <th style="text-align: right;">Amount</th>
                            </tr>
                        </thead>
                        <tbody>
                `;
                
                charges.forEach(charge => {
                    html += `
                        <tr>
                            <td>${charge.item_description}</td>
                            <td style="text-align: center;">${charge.quantity}x @ ₵${parseFloat(charge.unit_price).toFixed(2)}</td>
                            <td style="text-align: right; font-weight: bold;">₵${parseFloat(charge.total_amount).toFixed(2)}</td>
                        </tr>
                    `;
                });
                
                html += `
                        </tbody>
                    </table>
                    <div style="text-align: right; margin-top: 10px; font-weight: bold; color: var(--primary-blue);">
                        F&B Subtotal: ₵${fbTotal.toFixed(2)}
                    </div>
                `;
            }
            
            html += `
                <div class="total-row">
                    GRAND TOTAL: ₵${grandTotal.toFixed(2)}
                </div>
                
                <div class="footer">
                    <p>Thank you for staying with us at Tima Sara Hotel!</p>
                    <p style="font-size: 14px; margin-top: 10px;">For queries, contact our front desk.</p>
                </div>
            `;
            
            document.getElementById('invoiceContent').innerHTML = html;
            document.getElementById('invoiceCard').style.display = 'block';
            
            // Scroll to invoice
            document.getElementById('invoiceCard').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            
            console.log('✅ Invoice generated successfully');
            
        } catch (error) {
            console.error('❌ Error:', error);
            alert('Failed to generate invoice: ' + error.message);
        }
    }
    
    function emailInvoice() {
        if (!currentInvoice) {
            alert('⚠️ Please select a booking first');
            return;
        }
        
        const { booking, grandTotal } = currentInvoice;
        const subject = `Invoice - ${booking.booking_reference}`;
        const body = `Dear ${booking.guest_name},\n\nYour invoice for ${booking.booking_reference}:\nTotal: ₵${grandTotal.toFixed(2)}\n\nThank you!\nTima Sara Hotel`;
        
        window.location.href = `mailto:${booking.guest_email}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
    }
    
    // Logout
    document.getElementById('logoutBtn')?.addEventListener('click', function() {
        if (confirm('Are you sure you want to logout?')) {
            localStorage.removeItem('hms_user');
            window.location.href = 'admin-login.html';
        }
    });
    
    console.log('✅ Invoice script loaded');

    
</script>
</body>
